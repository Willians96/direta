name: Deploy to VPS

# ============================================================
# ATIVADO APENAS POR DISPARO MANUAL.
#
# Antes de existir a VPS Hostinger, este workflow era disparado em TODO push
# na `main` e falhava (não há host/chave SSH). A partir de agora ele só roda
# sob demanda — em "Actions → Deploy to VPS → Run workflow" — ou quando o
# job for reabilitado com `on: push` após a migração.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Pular o build (apenas migrations + reload)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gate por variável do repositório (o contexto `secrets` NÃO é válido em `if` de job).
    # Crie em Settings → Secrets and variables → Actions → Variables → VPS_ENABLED = true
    # quando a VPS existir.
    if: ${{ vars.VPS_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes do setup-node (o cache: "pnpm" do setup-node exige o pnpm instalado)
      - name: Install pnpm 12.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/app
            bash scripts/deploy.sh ${{ inputs.skip_build && 'SKIP_BUILD=1' || '' }}

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            sleep 10
            if curl -fsS "http://${{ secrets.VPS_HOST }}:3000/api/health"; then
              echo "aplicação saudável"
              exit 0
            fi
            echo "aguardando ($i/10)"
          done
          echo "health check falhou"
          exit 1

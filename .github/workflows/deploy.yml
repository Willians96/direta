name: Deploy to VPS

# ============================================================
# Deploy do sistema na VPS própria (76.13.123.172).
#
# O deploy "oficial" hoje é manual, por SSH:
#   ssh -i ~/.ssh/id_ed25519_direta_vps root@76.13.123.172 \
#     "cd /opt/gescola/app && bash scripts/deploy-vps-docker.sh"
#
# Este workflow é a automação opcional do mesmo caminho (build da imagem →
# migrations → recria o container → health check). Ele é disparado em
# "Actions → Deploy to VPS → Run workflow" e só roda se a variável de
# repositório VPS_ENABLED estiver como "true"
# (Settings → Secrets and variables → Actions → Variables).
#
# A Vercel NÃO faz mais parte do fluxo: o sistema roda em app.scioti.tech,
# na VPS, com Docker + Traefik.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      skip_build:
        description: "Pular o build da imagem (apenas migrations + recreate)"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Gate por variável do repositório (o contexto `secrets` NÃO é válido em `if` de job).
    if: ${{ vars.VPS_ENABLED == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm antes do setup-node (o cache: "pnpm" do setup-node exige o pnpm instalado)
      - name: Install pnpm 12.4.1
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Build local só para pegar erro de compilação antes de tocar na VPS.
      # O build que vale é o do Docker, feito no servidor.
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/gescola/app
            bash scripts/deploy-vps-docker.sh

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # O container não publica porta no host: o health check roda de dentro dele.
            docker exec gescola-app curl -fsS http://localhost:3000/api/health
            docker ps --filter name=gescola --format '{{.Names}}: {{.Status}}'
